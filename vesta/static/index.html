<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وستا | حسابداری</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>
<div id="login" class="login-wrap"><form id="login-form" class="login-card"><div class="brand-mark">V</div><h1>حسابداری وستا</h1><p class="muted">محیط ارزیابی مستقل · بدون اتصال زنده</p><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required><label for="password">رمز عبور</label><input id="password" name="password" autocomplete="current-password" type="password" required><button class="primary">ورود به پنل</button><p id="login-error" role="alert"></p></form></div>
<div id="app" hidden><aside><div class="brand"><span class="brand-mark">V</span><div><strong>وستا</strong><small>مدیریت مالی</small></div></div><nav aria-label="ناوبری اصلی"><button data-view="dashboard">نمای کلی</button><button data-view="journals">اسناد حسابداری</button><button data-view="trial">تراز آزمایشی</button><button data-view="events">صف تطبیق</button><button data-view="products">کالا و افتتاحیه</button><button data-view="periods">دوره‌های مالی</button><button data-view="audit">تاریخچه عملیات</button></nav><div class="aside-bottom"><small id="identity"></small><button id="logout">خروج از حساب</button></div></aside><main><header><div><span class="eyebrow">VESTA ACCOUNTING</span><h1 id="title">نمای کلی</h1></div><div class="badge">نسخه ارزیابی</div></header><div class="warning">داده آزمایشی و دفاتر مستقل؛ نه سود تأییدشده، نه اتصال به فروشگاه زنده.</div><p id="message" role="status" aria-live="polite"></p><div id="view"></div></main></div>
<noscript>برای استفاده از پنل، جاوااسکریپت را فعال کنید.</noscript>
</body></html>
