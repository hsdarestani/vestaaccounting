services:
  accounting-evaluation:
    build: .
    ports:
      - '127.0.0.1:8089:8000'
    environment:
      VESTA_DB: /data/evaluation.sqlite
      VESTA_LOCAL_HTTP: '1'
    volumes:
      - evaluation-data:/data
    mem_limit: 384m
    cpus: 0.75
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  evaluation-data:
