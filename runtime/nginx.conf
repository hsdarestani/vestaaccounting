server {
  listen 8080;
  server_name hesab.vesta-cosmetics.ir;
  access_log off;
  client_max_body_size 2m;
  location / {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host hesab.vesta-cosmetics.ir;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 40s;
    proxy_buffering on;
  }
}
