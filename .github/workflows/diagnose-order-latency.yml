name: Diagnose deep WooCommerce order-page latency (read-only)
on:
  push:
    branches: ['diagnostics/order-page-timing']
    paths:
      - '.github/workflows/diagnose-order-latency.yml'
      - 'runtime/diagnose-order-latency.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax verification
        run: node --check runtime/diagnose-order-latency.mjs
      - name: Read-only source latency probe with no order data logged
        env:
          SERVERIP: ${{ secrets.SERVERIP }}
          ROOTPASS: ${{ secrets.ROOTPASS }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 8 -t ed25519 "$SERVERIP" > "$RUNNER_TEMP/accounting_known" 2>/dev/null
          fingerprint=$(ssh-keygen -lf "$RUNNER_TEMP/accounting_known" -E sha256 | awk 'NR==1{print $2}')
          test "$fingerprint" = 'SHA256:KevhknUxbSfri8TfKLxb8XMgG+vxtrRp/zHyRGWLc0k'
          export SSHPASS="$ROOTPASS"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/accounting_known"             -o PreferredAuthentications=password -o PubkeyAuthentication=no             "root@$SERVERIP" 'cd /srv/vesta-accounting/release/runtime && docker compose --env-file /srv/vesta-accounting/private/.compose.env -f compose.yml -f /srv/vesta-accounting/private/compose.source-sync.yml --profile source-sync exec -T sync node --input-type=module' < runtime/diagnose-order-latency.mjs
