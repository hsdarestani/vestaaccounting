name: Verify accounting host readiness after stopped install
on:
  push:
    branches: ["audit/isolated-host-gate-20261122"]
    paths: [".github/workflows/host-gate-audit.yml"]
permissions:
  contents: read
concurrency:
  group: vesta-accounting-host
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check resource gates with no private data or secrets in logs
        env:
          SERVERIP: ${{ secrets.SERVERIP }}
          ROOTPASS: ${{ secrets.ROOTPASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          umask 077
          ssh-keyscan -T 8 -t ed25519 "$SERVERIP" > "$RUNNER_TEMP/accounting_known" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/accounting_known" -E sha256 | awk 'NR==1{print $2}')" = 'SHA256:KevhknUxbSfri8TfKLxb8XMgG+vxtrRp/zHyRGWLc0k'
          export SSHPASS="$ROOTPASS"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/accounting_known" -o ConnectTimeout=15 "root@$SERVERIP" 'bash -s' <<'REMOTE'
          set -eu
          ram=$(awk '/^MemAvailable:/{print int($2/1024)}' /proc/meminfo)
          disk=$(df -Pm /srv/vesta-accounting | awk 'NR==2{print $4}')
          if [ "$ram" -ge 3000 ]; then echo memory_gate=pass; else echo memory_gate=fail; fi
          if [ "$disk" -ge 15000 ]; then echo disk_gate=pass; else echo disk_gate=fail; fi
          if docker ps -aq --filter label=com.docker.compose.project=vesta-accounting-source | grep -q .; then echo accounting_containers_exist=yes; else echo accounting_containers_exist=no; fi
          if test -f /srv/vesta-accounting/private/installed; then echo installation_marker=present; else echo installation_marker=absent; fi
          printf 'available_ram_mib=%s\n' "$ram"
          printf 'available_accounting_disk_mib=%s\n' "$disk"
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          printf 'available_docker_disk_mib=%s\n' "$(df -Pm "$docker_root" | awk 'NR==2{print $4}')"
          if [ "$ram" -ge 2200 ] && [ "$disk" -ge 11776 ] && [ "$(df -Pm "$docker_root" | awk 'NR==2{print $4}')" -ge 11776 ]; then echo upgrade_capacity_gate=pass; else echo upgrade_capacity_gate=fail; fi
          docker image ls vesta-accounting --format 'accounting_image={{.Tag}} size={{.Size}}'
          docker image ls vesta-accounting -q | sort -u | wc -l | awk '{print "accounting_image_ids=" $1}'
          for name in release.tar.gz image.tar.gz; do
            file="/srv/vesta-accounting/$name"
            if test -f "$file" && test ! -L "$file"; then du -m -- "$file" | awk -v name="$name" '{print "temporary_archive=" name " mib=" $1}'; fi
          done
          docker system df --format 'docker_storage={{.Type}} size={{.Size}} reclaimable={{.Reclaimable}}'
          du -sm -- /srv/vesta-accounting/backups /srv/vesta-accounting/private /srv/vesta-accounting/release | awk '{print "accounting_directory_mib=" $1 " type=" substr($2,22)}'
          df -Pm /srv/vesta-accounting | awk 'NR==2{print "filesystem_total_mib=" $2}'
          cd /srv/vesta-accounting/release/runtime
          docker compose --env-file /srv/vesta-accounting/private/.compose.env -f compose.yml exec -T postgres psql -X -A -t -U accounting -d vesta_accounting -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          SELECT 'source_activity kind='||c.kind||' day='||((r.payload->>'date_created_gmt')::timestamp AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Tehran')::date||' count='||count(*)
          FROM raw_current c JOIN raw_revisions r ON r.id=c.revision_id
          WHERE c.kind IN ('orders','refunds') AND (r.payload->>'date_created_gmt')>='2026-11-23T20:30:00'
           AND (r.payload->>'date_created_gmt')<'2026-11-26T20:30:00'
          GROUP BY c.kind,((r.payload->>'date_created_gmt')::timestamp AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Tehran')::date ORDER BY 1;
          SELECT 'database_bytes='||pg_database_size(current_database());
          SELECT 'opening_costs='||count(*) FROM opening_input_costs_v1;
          SELECT 'opening_evidence_rows='||count(*) FROM opening_input_balances_v1;
          SELECT 'financial_documents='||count(*) FROM documents;
          SELECT 'opening_migration='||count(*) FROM migrations WHERE version='004';
          SELECT 'journal_states draft='||count(*) FILTER(WHERE status='draft')||
           ' approved='||count(*) FILTER(WHERE status='approved')||
           ' posted='||count(*) FILTER(WHERE status='posted') FROM journals;
          SELECT 'posted_trial_is_balanced='||(coalesce(sum(l.debit::numeric),0)=coalesce(sum(l.credit::numeric),0))
           FROM lines l JOIN journals j ON j.id=l.journal WHERE j.status='posted';
          SELECT 'linked_opening_accounts='||count(DISTINCT account)||' evidence_links='||count(*)||
           ' supplier_links='||count(DISTINCT party) FROM opening_balance_account_links;
          SELECT 'gateway_rules='||count(*) FROM opening_gateway_rules;
          SELECT 'stock_evidence status='||review_status||' count='||count(*) FROM opening_stock_cost_review
           GROUP BY review_status ORDER BY review_status;
          SELECT 'unresolved_opening_exceptions='||count(*) FROM exceptions
           WHERE kind='opening_reconciliation' AND status='review';
          SELECT 'source_sync_failures='||count(*) FILTER(WHERE status='failed')||
           ' source_sync_complete='||count(*) FILTER(WHERE status='complete') FROM sync_state;
          SELECT 'source_counts kind='||kind||' rows='||count(*) FROM raw_current GROUP BY kind ORDER BY kind;
          COMMIT;
          SQL
          REMOTE
