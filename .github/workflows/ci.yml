name: Accounting evaluation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: node --check vesta/static/app.js
      - run: python -m compileall -q vesta
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check edge-demo/worker.mjs && node --check edge-demo/ui.mjs
      - run: node edge-demo/test.mjs
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: synthetic_accounting
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d synthetic_accounting -v ON_ERROR_STOP=1 < postgres/001_ledger.sql
      - run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d synthetic_accounting -v ON_ERROR_STOP=1 < postgres/acceptance.sql
