name: Accounting evaluation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: node --check vesta/static/app.js
      - run: python -m compileall -q vesta
