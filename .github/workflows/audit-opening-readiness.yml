name: Audit opening readiness aggregates (read-only)
on:
  push:
    branches: ['audit/opening-readiness-20261123']
    paths:
      - '.github/workflows/audit-opening-readiness.yml'
      - 'runtime/opening-readiness-audit.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only audit script
        run: bash -n runtime/opening-readiness-audit.sh
      - name: Inspect storefront reference data and financial opening prerequisites
        env:
          SERVERIP: ${{ secrets.SERVERIP }}
          ROOTPASS: ${{ secrets.ROOTPASS }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 8 -t ed25519 "$SERVERIP" > "$RUNNER_TEMP/accounting_known" 2>/dev/null
          fingerprint=$(ssh-keygen -lf "$RUNNER_TEMP/accounting_known" -E sha256 | awk 'NR==1{print $2}')
          test "$fingerprint" = 'SHA256:KevhknUxbSfri8TfKLxb8XMgG+vxtrRp/zHyRGWLc0k'
          export SSHPASS="$ROOTPASS"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/accounting_known"             -o PreferredAuthentications=password -o PubkeyAuthentication=no             "root@$SERVERIP" 'bash -s' < runtime/opening-readiness-audit.sh
