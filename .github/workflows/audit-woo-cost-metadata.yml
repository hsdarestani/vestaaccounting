name: Audit Woo cost metadata names (read-only)
on:
  push:
    branches: ['diagnostics/vesta-cost-metadata']
    paths:
      - '.github/workflows/audit-woo-cost-metadata.yml'
      - 'runtime/audit-woo-cost-metadata.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: bash -n runtime/audit-woo-cost-metadata.sh
      - name: Inspect only metadata key names, no product costs or identities in logs
        env:
          SERVERIP: ${{ secrets.SERVERIP }}
          ROOTPASS: ${{ secrets.ROOTPASS }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 8 -t ed25519 "$SERVERIP" > "$RUNNER_TEMP/accounting_known" 2>/dev/null
          fingerprint=$(ssh-keygen -lf "$RUNNER_TEMP/accounting_known" -E sha256 | awk 'NR==1{print $2}')
          test "$fingerprint" = 'SHA256:KevhknUxbSfri8TfKLxb8XMgG+vxtrRp/zHyRGWLc0k'
          export SSHPASS="$ROOTPASS"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/accounting_known"             -o PreferredAuthentications=password -o PubkeyAuthentication=no             "root@$SERVERIP" 'bash -s' < runtime/audit-woo-cost-metadata.sh
